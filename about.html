<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle, #000 0%, #001f1f 100%);
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #00ffff;
            border-radius: 50%;
            animation: float 10s infinite linear;
            opacity: 0.7;
            box-shadow: 0 0 10px #00ffff;
        }

        .neon-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0, 255, 255, 0.1) 0%, transparent 70%);
            z-index: -1;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .neon-header {
            font-size: 2.5rem;
            color: #00ffff;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff, 0 0 40px #00ffff;
            animation: text-glow 2s ease-in-out infinite alternate;
            margin-bottom: 25px;
        }

        .neon-credits {
            font-size: 1.4rem;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            animation: text-glow 2s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-50px) translateX(30px); }
            100% { transform: translateY(0) translateX(0); }
        }

        @keyframes text-glow {
            0% { text-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff, 0 0 40px #00ffff; }
            100% { text-shadow: 0 0 20px #00ffff, 0 0 35px #00ffff, 0 0 60px #00ffff; }
        }
    </style>
    <script>
        function createParticles(count) {
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                document.body.appendChild(particle);
            }
        }
        window.onload = () => createParticles(50);
    </script>
</head>
<body>
    <div class="neon-lines"></div>
    <div class="container">
        <div class="neon-header">About Us</div>
        <div class="neon-credits">Credits to Robert<br>We working 24/7<br>Thanks Maus</div>
    </div>
</body>
</html>
