<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000;
            overflow: hidden;
            position: relative;
            font-family: 'Arial', sans-serif;
        }

        .neon-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.05) 10%,
                rgba(255, 255, 255, 0.2) 20%,
                rgba(255, 255, 255, 0.05) 30%,
                transparent 50%
            );
            background-size: 200px 200px;
            animation: shift 5s linear infinite;
            z-index: -1;
        }

        .line {
            position: absolute;
            background: #fff;
            box-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px rgba(255, 255, 255, 0.8);
            animation: flicker 1.5s infinite alternate;
        }

        .line-horizontal-1 {
            width: 100%;
            height: 2px;
            top: 20%;
            left: 0;
        }

        .line-horizontal-2 {
            width: 100%;
            height: 2px;
            top: 80%;
            left: 0;
        }

        .line-vertical-1 {
            width: 2px;
            height: 100%;
            left: 20%;
            top: 0;
        }

        .line-vertical-2 {
            width: 2px;
            height: 100%;
            left: 80%;
            top: 0;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .neon-text {
            font-size: 4rem;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #0ff,
                0 0 30px #0ff;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .neon-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 1.5rem;
            color: #fff;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.2) 0%, transparent 70%);
            border: 2px solid #0ff;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #0ff,
                0 0 10px #0ff,
                0 0 20px #0ff;
            box-shadow: inset 0 0 10px #0ff, 0 0 5px #0ff, 0 0 10px #0ff, 0 0 15px #0ff;
            animation: button-glow 1.5s ease-in-out infinite alternate;
            text-decoration: none;
            z-index: 1;
        }

        .neon-button:hover {
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, transparent 70%);
            box-shadow: inset 0 0 15px #0ff, 0 0 10px #0ff, 0 0 20px #0ff, 0 0 25px #0ff;
        }

        .nav-link {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #ecf0f1;
            text-decoration: none;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        .nav-link:hover {
            color: #bdc3c7;
        }

        @keyframes flicker {
            0%, 100% {
                box-shadow: 
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 20px rgba(255, 255, 255, 0.8);
            }
            50% {
                box-shadow: 
                    0 0 3px #fff,
                    0 0 7px #fff,
                    0 0 15px rgba(255, 255, 255, 0.6);
            }
        }

        @keyframes shift {
            0% { background-position: 0 0; }
            100% { background-position: 200px 200px; }
        }

        @keyframes glow {
            0% { text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 20px #0ff,
                    0 0 30px #0ff;
            }
            100% { text-shadow: 
                    0 0 10px #fff,
                    0 0 20px #fff,
                    0 0 40px #0ff,
                    0 0 60px #0ff;
            }
        }

        @keyframes button-glow {
            0% { box-shadow: inset 0 0 10px #0ff, 0 0 5px #0ff, 0 0 10px #0ff, 0 0 15px #0ff; }
            100% { box-shadow: inset 0 0 20px #0ff, 0 0 10px #0ff, 0 0 20px #0ff, 0 0 30px #0ff; }
        }
    </style>
</head>
<body>
    <div class="neon-lines"></div>
    <div class="line line-horizontal-1"></div>
    <div class="line line-horizontal-2"></div>
    <div class="line line-vertical-1"></div>
    <div class="line line-vertical-2"></div>
    <div class="container">
        <div class="neon-text">Roblox&Scripts starting soon!...</div>
        <a href="about.html" class="nav-link">About Us</a>
    </div>
    <a href="https://chromedino.com/" class="neon-button">Play Dinosaur</a>
</body>
</html>
