<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle, #000 0%, #001f1f 100%);
            overflow: hidden;
            position: relative;
            font-family: 'Arial', sans-serif;
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #00ffff;
            border-radius: 50%;
            animation: float 10s infinite linear;
            opacity: 0.7;
            box-shadow: 0 0 10px #00ffff;
        }

        .neon-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0, 255, 255, 0.1) 0%, transparent 70%);
            z-index: -1;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: center;
        }

        .neon-text {
            font-size: 4.5rem;
            color: #00ffff;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff, 0 0 40px #00ffff;
            animation: text-glow 2s ease-in-out infinite alternate;
            margin-bottom: 30px;
        }

        .nav-button {
            margin: 15px;
            padding: 12px 25px;
            font-size: 1.3rem;
            color: #fff;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, transparent 70%);
            border: 3px solid #00ffff;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            text-shadow: 0 0 8px #00ffff;
            box-shadow: inset 0 0 15px #00ffff, 0 0 8px #00ffff;
            animation: button-glow 1.5s ease-in-out infinite alternate;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .nav-button:hover {
            transform: scale(1.05);
            background: radial-gradient(circle, rgba(0, 255, 255, 0.4) 0%, transparent 70%);
            box-shadow: inset 0 0 20px #00ffff, 0 0 12px #00ffff;
        }

        .neon-button {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 25px;
            font-size: 1.6rem;
            color: #fff;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, transparent 70%);
            border: 3px solid #00ffff;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            text-shadow: 0 0 8px #00ffff;
            box-shadow: inset 0 0 15px #00ffff, 0 0 8px #00ffff, 0 0 15px #00ffff;
            animation: button-glow 1.5s ease-in-out infinite alternate;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .neon-button:hover {
            transform: scale(1.05);
            background: radial-gradient(circle, rgba(0, 255, 255, 0.4) 0%, transparent 70%);
            box-shadow: inset 0 0 20px #00ffff, 0 0 12px #00ffff, 0 0 20px #00ffff;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-50px) translateX(30px); }
            100% { transform: translateY(0) translateX(0); }
        }

        @keyframes text-glow {
            0% { text-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff, 0 0 40px #00ffff; }
            100% { text-shadow: 0 0 20px #00ffff, 0 0 35px #00ffff, 0 0 60px #00ffff; }
        }

        @keyframes button-glow {
            0% { box-shadow: inset 0 0 15px #00ffff, 0 0 8px #00ffff; }
            100% { box-shadow: inset 0 0 20px #00ffff, 0 0 12px #00ffff; }
        }
    </style>
    <script>
        function createParticles(count) {
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                document.body.appendChild(particle);
            }
        }
        window.onload = () => createParticles(50);
    </script>
</head>
<body>
    <div class="neon-lines"></div>
    <div class="container">
        <div class="neon-text">Scripts&Roblox</div>
        <a href="about.html" class="nav-button">About Us</a>
        <a href="scripts.html" class="nav-button">Scripts</a>
    </div>
    <a href="https://chromedino.com/" class="neon-button">Play Dinosaur</a>
</body>
</html>
