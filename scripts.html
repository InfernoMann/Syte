<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripts Page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000;
            overflow: hidden;
            position: relative;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .neon-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                45deg,
                rgba(0, 255, 255, 0.05) 10%,
                rgba(0, 255, 255, 0.2) 20%,
                rgba(0, 255, 255, 0.05) 30%,
                transparent 50%
            );
            background-size: 200px 200px;
            animation: shift 5s linear infinite;
            z-index: -1;
        }

        .neon-title {
            font-size: 4rem;
            color: #00ffff;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 30px #00ffff;
            animation: title-glow 2s ease-in-out infinite alternate;
            margin-top: 20px;
            z-index: 1;
        }

        .search-bar {
            position: relative;
            margin-top: 20px;
            width: 60%;
            max-width: 600px;
            height: 50px;
            background: transparent;
            border: 2px solid #00ffff;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff;
            animation: search-glow 1.5s ease-in-out infinite alternate;
        }

        .search-bar input {
            width: 90%;
            height: 80%;
            background: transparent;
            border: none;
            color: #00ffff;
            font-size: 1.5rem;
            text-align: center;
            outline: none;
            text-shadow: 0 0 5px #00ffff;
        }

        .search-bar input::placeholder {
            color: #00ffff;
            opacity: 0.7;
        }

        .script-container {
            margin-top: 40px;
            width: 80%;
            max-width: 800px;
            height: 60vh;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 10px;
            z-index: 1;
        }

        .script-box {
            width: 200px;
            height: 200px;
            background: transparent;
            border: 2px solid #00ffff;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff;
            animation: box-glow 2s ease-in-out infinite alternate;
        }

        .game-text {
            font-size: 1.5rem;
            color: #00ffff;
            text-shadow: 
                0 0 5px #00ffff,
                0 0 10px #00ffff;
            text-align: center;
        }

        .get-button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 1.2rem;
            color: #fff;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.2) 0%, transparent 70%);
            border: 2px solid #00ffff;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #00ffff,
                0 0 10px #00ffff;
            box-shadow: inset 0 0 10px #00ffff, 0 0 5px #00ffff, 0 0 10px #00ffff;
            animation: button-glow 1.5s ease-in-out infinite alternate;
            text-decoration: none;
        }

        .get-button:hover {
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, transparent 70%);
            box-shadow: inset 0 0 15px #00ffff, 0 0 10px #00ffff, 0 0 20px #00ffff;
        }

        @keyframes shift {
            0% { background-position: 0 0; }
            100% { background-position: 200px 200px; }
        }

        @keyframes title-glow {
            0% { text-shadow: 
                    0 0 10px #00ffff,
                    0 0 20px #00ffff,
                    0 0 30px #00ffff;
            }
            100% { text-shadow: 
                    0 0 20px #00ffff,
                    0 0 40px #00ffff,
                    0 0 60px #00ffff;
            }
        }

        @keyframes search-glow {
            0% { box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
            100% { box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
        }

        @keyframes box-glow {
            0% { box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; }
            100% { box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
        }

        @keyframes button-glow {
            0% { box-shadow: inset 0 0 10px #00ffff, 0 0 5px #00ffff, 0 0 10px #00ffff; }
            100% { box-shadow: inset 0 0 20px #00ffff, 0 0 10px #00ffff, 0 0 20px #00ffff; }
        }
    </style>
</head>
<body>
    <div class="neon-lines"></div>
    <div class="neon-title">Scripts</div>
    <div class="search-bar">
        <input type="text" placeholder="Search" />
    </div>
    <div class="script-container">
        <div class="script-box">
            <div class="game-text">Game: Brookhaven</div>
            <a href="Brookhaven.html" class="get-button">Get</a>
        </div>
        <div class="script-box">
            <div class="game-text">Game: Grow a garden Maus</div>
            <a href="Growagarden.html" class="get-button">Get</a>
        </div>
    </div>
</body>
</html>
