<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripts Page</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle, #000 0%, #001f1f 100%);
            overflow: hidden;
            position: relative;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #00ffff;
            border-radius: 50%;
            animation: float 10s infinite linear;
            opacity: 0.7;
            box-shadow: 0 0 10px #00ffff;
        }

        .neon-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0, 255, 255, 0.1) 0%, transparent 70%);
            z-index: -1;
        }

        .neon-title {
            font-size: 4.5rem;
            color: #00ffff;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff, 0 0 40px #00ffff;
            animation: text-glow 2s ease-in-out infinite alternate;
            margin-top: 20px;
            z-index: 1;
        }

        .search-bar {
            margin-top: 20px;
            width: 60%;
            max-width: 600px;
            height: 50px;
            background: transparent;
            border: 3px solid #00ffff;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px #00ffff;
            animation: search-glow 1.5s ease-in-out infinite alternate;
        }

        .search-bar input {
            width: 90%;
            height: 80%;
            background: transparent;
            border: none;
            color: #00ffff;
            font-size: 1.6rem;
            text-align: center;
            outline: none;
            text-shadow: 0 0 8px #00ffff;
        }

        .search-bar input::placeholder {
            color: #00ffff;
            opacity: 0.7;
        }

        .script-container {
            margin-top: 40px;
            width: 80%;
            max-width: 800px;
            height: 60vh;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 15px;
            z-index: 1;
        }

        .script-box {
            width: 220px;
            height: 220px;
            background: rgba(0, 255, 255, 0.1);
            border: 3px solid #00ffff;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff;
            animation: box-glow 2s ease-in-out infinite alternate;
            transition: transform 0.2s;
        }

        .script-box:hover {
            transform: scale(1.05);
        }

        .game-text {
            font-size: 1.6rem;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            text-align: center;
            margin-bottom: 15px;
        }

        .get-button {
            padding: 12px 25px;
            font-size: 1.3rem;
            color: #fff;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, transparent 70%);
            border: 3px solid #00ffff;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            text-shadow: 0 0 8px #00ffff;
            box-shadow: inset 0 0 15px #00ffff, 0 0 8px #00ffff;
            animation: button-glow 1.5s ease-in-out infinite alternate;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .get-button:hover {
            transform: scale(1.05);
            background: radial-gradient(circle, rgba(0, 255, 255, 0.4) 0%, transparent 70%);
            box-shadow: inset 0 0 20px #00ffff, 0 0 12px #00ffff;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-50px) translateX(30px); }
            100% { transform: translateY(0) translateX(0); }
        }

        @keyframes text-glow {
            0% { text-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff, 0 0 40px #00ffff; }
            100% { text-shadow: 0 0 20px #00ffff, 0 0 35px #00ffff, 0 0 60px #00ffff; }
        }

        @keyframes search-glow {
            0% { box-shadow: 0 0 15px #00ffff; }
            100% { box-shadow: 0 0 25px #00ffff; }
        }

        @keyframes box-glow {
            0% { box-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff; }
            100% { box-shadow: 0 0 20px #00ffff, 0 0 35px #00ffff; }
        }

        @keyframes button-glow {
            0% { box-shadow: inset 0 0 15px #00ffff, 0 0 8px #00ffff; }
            100% { box-shadow: inset 0 0 20px #00ffff, 0 0 12px #00ffff; }
        }
    </style>
    <script>
        function createParticles(count) {
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = `${Math.random() * 100}vw`;
                particle.style.top = `${Math.random() * 100}vh`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                document.body.appendChild(particle);
            }
        }
        window.onload = () => createParticles(50);
    </script>
</head>
<body>
    <div class="neon-lines"></div>
    <div class="neon-title">Scripts</div>
    <div class="search-bar">
        <input type="text" placeholder="Search" />
    </div>
    <div class="script-container">
        <div class="script-box">
            <div class="game-text">Game: Brookhaven</div>
            <a href="Brookhaven.html" class="get-button">Get</a>
        </div>
        <div class="script-box">
            <div class="game-text">Game: Adopt Me</div>
            <a href="#" class="get-button">Get</a>
        </div>
        <div class="script-box">
            <div class="game-text">Game: Blue Lock</div>
            <a href="BlueLock.html" class="get-button">Get</a>
        </div>
        <div class="script-box">
            <div class="game-text">Game: Steal A Brainrot<br>Arbix hub | key:Arbix hub</div>
            <a href="StealABrainrot" class="get-button">Get</a>
        </div>
    </div>
</body>
</html>
