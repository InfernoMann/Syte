<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brookhaven Script</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #000;
            overflow: hidden;
            position: relative;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .neon-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                45deg,
                rgba(0, 255, 255, 0.05) 10%,
                rgba(0, 255, 255, 0.2) 20%,
                rgba(0, 255, 255, 0.05) 30%,
                transparent 50%
            );
            background-size: 200px 200px;
            animation: shift 5s linear infinite;
            z-index: -1;
        }

        .neon-title {
            font-size: 4rem;
            color: #00ffff;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 30px #00ffff;
            animation: title-glow 2s ease-in-out infinite alternate;
            margin-top: 20px;
            z-index: 1;
        }

        .script-container {
            margin-top: 40px;
            text-align: center;
            z-index: 1;
        }

        .script-text {
            font-size: 1.2rem;
            color: #00ffff;
            text-shadow: 
                0 0 5px #00ffff,
                0 0 10px #00ffff;
            margin-bottom: 20px;
            word-wrap: break-word;
            max-width: 600px;
        }

        .copy-button {
            padding: 10px 20px;
            font-size: 1.2rem;
            color: #fff;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.2) 0%, transparent 70%);
            border: 2px solid #00ffff;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            text-shadow: 
                0 0 5px #00ffff,
                0 0 10px #00ffff;
            box-shadow: inset 0 0 10px #00ffff, 0 0 5px #00ffff, 0 0 10px #00ffff;
            animation: button-glow 1.5s ease-in-out infinite alternate;
            text-decoration: none;
        }

        .copy-button:hover {
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, transparent 70%);
            box-shadow: inset 0 0 15px #00ffff, 0 0 10px #00ffff, 0 0 20px #00ffff;
        }

        @keyframes shift {
            0% { background-position: 0 0; }
            100% { background-position: 200px 200px; }
        }

        @keyframes title-glow {
            0% { text-shadow: 
                    0 0 10px #00ffff,
                    0 0 20px #00ffff,
                    0 0 30px #00ffff;
            }
            100% { text-shadow: 
                    0 0 20px #00ffff,
                    0 0 40px #00ffff,
                    0 0 60px #00ffff;
            }
        }

        @keyframes button-glow {
            0% { box-shadow: inset 0 0 10px #00ffff, 0 0 5px #00ffff, 0 0 10px #00ffff; }
            100% { box-shadow: inset 0 0 20px #00ffff, 0 0 10px #00ffff, 0 0 20px #00ffff; }
        }
    </style>
</head>
<body>
    <div class="neon-lines"></div>
    <div class="neon-title">Brookhaven</div>
    <div class="script-container">
        <div class="script-text">loadstring(game:HttpGet("https://raw.githubusercontent.com/as6cd0/SP_Hub/refs/heads/main/Brookhaven"))()</div>
        <button class="copy-button" onclick="copyToClipboard()">Copy Script</button>
    </div>
    <script>
        function copyToClipboard() {
            const scriptText = "loadstring(game:HttpGet(\"https://raw.githubusercontent.com/as6cd0/SP_Hub/refs/heads/main/Brookhaven\"))()";
            navigator.clipboard.writeText(scriptText).then(() => {
                alert("Script copied to clipboard!");
            }).catch(err => {
                console.error("Failed to copy text: ", err);
            });
        }
    </script>
</body>
</html>
